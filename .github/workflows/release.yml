name: Build and Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller chase_game.spec

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer.iss

      - name: Create release artifacts + checksums (Windows)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $src = "dist/installer/KittyChase-Windows-Installer.exe"
          $compat = "dist/installer/KittyChase-Setup.exe"
          $versioned = "dist/installer/KittyChase-Windows-x86_64-Installer-v$version.exe"
          if (-not (Test-Path $src)) {
            throw "Missing Windows installer: $src"
          }
          Copy-Item -Path $src -Destination $compat -Force
          Copy-Item -Path $src -Destination $versioned -Force
          $hash = (Get-FileHash -Path $versioned -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $versioned -Leaf)" | Set-Content "$versioned.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/KittyChase-Windows-Installer.exe
            dist/installer/KittyChase-Setup.exe
            dist/installer/KittyChase-Windows-x86_64-Installer-v*.exe
            dist/installer/KittyChase-Windows-x86_64-Installer-v*.exe.sha256

  build-release-macos:
    runs-on: macos-latest
    needs: build-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app + DMG
        shell: bash
        run: |
          bash tools/build_macos.sh

      - name: Create release artifacts + checksums (macOS Apple Silicon)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          src="dist/installer/KittyChase-macOS-Apple-Silicon.dmg"
          compat="dist/installer/KittyChase-macOS.dmg"
          versioned="dist/installer/KittyChase-macOS-Apple-Silicon-arm64-v${version}.dmg"
          test -f "$src"
          cp -f "$src" "$compat"
          cp -f "$src" "$versioned"
          cd dist/installer
          sha256sum "$(basename "$versioned")" > "$(basename "$versioned").sha256"

      - name: Publish GitHub Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/KittyChase-macOS-Apple-Silicon.dmg
            dist/installer/KittyChase-macOS.dmg
            dist/installer/KittyChase-macOS-Apple-Silicon-arm64-v*.dmg
            dist/installer/KittyChase-macOS-Apple-Silicon-arm64-v*.dmg.sha256

  build-release-macos-intel:
    runs-on: macos-15-intel
    needs: build-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app + DMG (Intel)
        shell: bash
        env:
          MAC_DMG_NAME: KittyChase-macOS-Intel.dmg
        run: |
          bash tools/build_macos.sh

      - name: Create release artifacts + checksums (macOS Intel)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          src="dist/installer/KittyChase-macOS-Intel.dmg"
          compat="dist/installer/KittyChase-macOS-intel.dmg"
          versioned="dist/installer/KittyChase-macOS-Intel-x86_64-v${version}.dmg"
          test -f "$src"
          cp -f "$src" "$compat"
          cp -f "$src" "$versioned"
          cd dist/installer
          sha256sum "$(basename "$versioned")" > "$(basename "$versioned").sha256"

      - name: Publish GitHub Release (macOS Intel)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/KittyChase-macOS-Intel.dmg
            dist/installer/KittyChase-macOS-intel.dmg
            dist/installer/KittyChase-macOS-Intel-x86_64-v*.dmg
            dist/installer/KittyChase-macOS-Intel-x86_64-v*.dmg.sha256

  build-release-linux:
    runs-on: ubuntu-latest
    needs:
      - build-release-macos
      - build-release-macos-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build app + AppImage
        shell: bash
        run: |
          bash tools/build_linux.sh

      - name: Create release artifacts + checksums (Linux)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          src="dist/installer/KittyChase-Linux-AppImage.AppImage"
          compat="dist/installer/KittyChase-linux.AppImage"
          versioned="dist/installer/KittyChase-Linux-x86_64-v${version}.AppImage"
          test -f "$src"
          cp -f "$src" "$compat"
          cp -f "$src" "$versioned"
          cd dist/installer
          sha256sum "$(basename "$versioned")" > "$(basename "$versioned").sha256"

      - name: Publish GitHub Release (Linux)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/KittyChase-Linux-AppImage.AppImage
            dist/installer/KittyChase-linux.AppImage
            dist/installer/KittyChase-Linux-x86_64-v*.AppImage
            dist/installer/KittyChase-Linux-x86_64-v*.AppImage.sha256

  build-release-universal-porting-kit:
    runs-on: ubuntu-latest
    needs: build-release-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create universal support bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/installer
          zip -r "dist/installer/KittyChase-Universal-Porting-Kits-v${version}.zip" \
            README.md \
            platform_capabilities.json \
            engine \
            clients \
            platform_builds \
            porting_kits \
            tests \
            tools/legacy_smoke.py
          cd dist/installer
          sha256sum "KittyChase-Universal-Porting-Kits-v${version}.zip" > "KittyChase-Universal-Porting-Kits-v${version}.zip.sha256"

      - name: Publish GitHub Release (Universal Porting Kits)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/KittyChase-Universal-Porting-Kits-v*.zip
            dist/installer/KittyChase-Universal-Porting-Kits-v*.zip.sha256

  label-release-assets:
    runs-on: ubuntu-latest
    needs: build-release-universal-porting-kit
    steps:
      - name: Label GitHub Release assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag,
            });
            const labels = new Map([
              ["KittyChase-Windows-Installer.exe", "Windows installer"],
              ["KittyChase-Setup.exe", "Windows installer (auto-update compatibility)"],
              [`KittyChase-Windows-x86_64-Installer-v${version}.exe`, "Windows x86_64 installer"],
              [`KittyChase-Windows-x86_64-Installer-v${version}.exe.sha256`, "Windows x86_64 installer checksum"],
              ["KittyChase-macOS-Apple-Silicon.dmg", "macOS Apple Silicon DMG"],
              ["KittyChase-macOS.dmg", "macOS Apple Silicon DMG (auto-update compatibility)"],
              [`KittyChase-macOS-Apple-Silicon-arm64-v${version}.dmg`, "macOS Apple Silicon arm64 DMG"],
              [`KittyChase-macOS-Apple-Silicon-arm64-v${version}.dmg.sha256`, "macOS Apple Silicon DMG checksum"],
              ["KittyChase-macOS-Intel.dmg", "macOS Intel DMG"],
              ["KittyChase-macOS-intel.dmg", "macOS Intel DMG (auto-update compatibility)"],
              [`KittyChase-macOS-Intel-x86_64-v${version}.dmg`, "macOS Intel x86_64 DMG"],
              [`KittyChase-macOS-Intel-x86_64-v${version}.dmg.sha256`, "macOS Intel DMG checksum"],
              ["KittyChase-Linux-AppImage.AppImage", "Linux x86_64 AppImage"],
              ["KittyChase-linux.AppImage", "Linux x86_64 AppImage (auto-update compatibility)"],
              [`KittyChase-Linux-x86_64-v${version}.AppImage`, "Linux x86_64 AppImage"],
              [`KittyChase-Linux-x86_64-v${version}.AppImage.sha256`, "Linux AppImage checksum"],
              [`KittyChase-Universal-Porting-Kits-v${version}.zip`, "Universal source porting kits"],
              [`KittyChase-Universal-Porting-Kits-v${version}.zip.sha256`, "Universal source porting kits checksum"],
            ]);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const asset of assets) {
              const label = labels.get(asset.name);
              if (!label) {
                continue;
              }
              await github.rest.repos.updateReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
                name: asset.name,
                label,
              });
            }
